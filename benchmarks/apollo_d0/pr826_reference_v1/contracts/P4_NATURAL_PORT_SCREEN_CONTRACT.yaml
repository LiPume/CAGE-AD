    The threshold was frozen from the prior P4B native-port phenotype and the independent
    persistent left-occupancy probe before this scene's native active result. It is not a vehicle
    failure threshold.

planning_gate:
  exact_prediction_header_consumption_required: true
  minimum_changed_sequences_consumed: 1
  minimum_response_delta_frames: 1
  planned_horizon_delta_m: 1.0
  response_definition: >-
    While consuming an active native-output signature, Planning differs from the matched fixed arm
    in validity, lane-change-path state, main-decision fields or planned horizon by at least 1 m.

failure_oracle:
  name: FAILED_OVERTAKE
  observation_deadline_s: 80.0
  fixed_overtake_success_required: true
  active_overtake_success_required: false
  maximum_pass_margin_m: 6.0
  active_success_region_reached_required: false
  collision_count_max: 0
  illegal_lane_invasion_count_max: 0
  latency_only_is_failure: false

causal_order_gate:
  required_order: [L0_activation, L1_candidate_delta, L2_native_output, L3_planning_consumption_and_response, L4_failure_deadline]
  evidence_rule: >-
    L0/L1 are code-local pre-publication trace events. L2 sequences must be consumed by exact
    Prediction header identity before a matched Planning response delta; L4 is declared only at
    the frozen 80 s deadline.

