schema_version: 1
contract_version: p4-sens-boundary-v2
status: FROZEN_BEFORE_FIRST_V2_RESULT
classification: NON_ADMISSION_CAUSAL_SENSITIVITY_PROBE
admission_evidence: false
supersedes_for_new_runs: p4-sens-boundary-v1
v1_disposition: INCONCLUSIVE_GATE_CONFLATED_PLANNING_RESPONSE_WITH_INFRASTRUCTURE
correction_scope: >-
  Separate transport/runtime health from Planning output validity. The Prediction semantics,
  active window, S1 dose, path-state threshold, lane-entry threshold, and planned-progress
  threshold are unchanged from v1.
source_scene:
  source_run_id: SN_N01_A
  source_manifest: /root/autodl_apollo10_g0_bundle/runtime/runs/pr826_greybox_demo_v1/SN_N01_A/manifest.json
  source_disposition: REJECT_MINIMUM_CLEARANCE_GATE
  scientific_reason_for_use: MECHANISM_POSITIVE_INTERFACE_SENSITIVITY_ONLY
target:
  obstacle_id: 1001
  active_elapsed_s: [12.0, 40.0]
semantics:
  S0_STRAIGHT:
    transform: IDENTITY_BYTE_EXACT
  S1_LEFT_MERGE_OCCUPANCY:
    transform: LEFT_NORMAL_SMOOTHSTEP
    lateral_offset_m: 3.5
    relative_start_s: 2.0
    relative_end_s: 4.0
    preserved_fields:
      - message_header
      - message_obstacle_count
      - non_target_obstacles
      - target_perception_obstacle
      - target_timestamp
      - target_predicted_period
      - target_is_static
      - target_trajectory_count
      - target_trajectory_probabilities
      - target_trajectory_point_count
      - target_point_relative_time
      - target_point_v
      - target_point_a
  S2_NO_TRAJECTORY:
    transform: CLEAR_TARGET_TRAJECTORY_ONLY
run_schedule:
  initial_screen_ids:
    S0_STRAIGHT: PV0_A
    S1_LEFT_MERGE_OCCUPANCY: PV1_A
    S2_NO_TRAJECTORY: PV2_NOT_REPEATED_V1_CONTROL_RETAINED
  conditional_confirmation_ids:
    S0_STRAIGHT: [PV0_B, PV0_C]
    S1_LEFT_MERGE_OCCUPANCY: [PV1_B, PV1_C]
  execution_order: [PV0_A, PV1_A, PV0_B, PV1_B, PV0_C, PV1_C]
matching:
  only_allowed_manifest_difference:
    - private_sensitivity_semantic
    - opaque_run_id
  unchanged:
    - carla_version
    - map
    - configured_map
    - ego_spawn
    - npc_spawn
    - npc_policy
    - npc_speed
    - route
    - seed
    - weather
    - deterministic_timing
    - bridge
    - prediction_binary
    - planning
    - control
    - camera
    - startup_order
transport_gates:
  route_accepted_required: true
  target_raw_prediction_messages_min: 20
  interposer_output_coverage_min: 0.95
  planning_channel_coverage_min: 0.95
  control_channel_coverage_min: 0.95
  runtime_exception_absent_required: true
  interposer_exception_absent_required: true
  collision_count_max: 0
  illegal_lane_invasion_count_max: 0
response_metrics_not_transport_gates:
  - planning_valid_ratio
  - planning_optimizer_failure_count
  - planning_fallback_count
  - prediction_trajectory_coverage_after_S2
semantic_gates:
  s0_identity_mismatch_max: 0
  s1_field_preservation_mismatch_max: 0
  s1_minimum_lateral_endpoint_delta_m: 3.4
  s1_maximum_lateral_endpoint_delta_m: 3.6
planning_delta_any:
  continuous_path_state_change_min_s: 1.0
  ego_lane_minus_1_entry_delay_min_s: 5.0
  ego_lane_minus_1_absent_deadline_s: 60.0
  five_second_planned_progress_drop_min_m: 5.0
  consecutive_target_decision_change_cycles_min: 5
stable_sensitivity:
  required_s0_s1_pairs: 3
  required_pairs_with_predeclared_delta: 3
  effect_direction: S1_REDUCES_OR_DELAYS_LANE_CHANGE_OR_PLANNED_PROGRESS
forbidden_claims:
  - GOLDEN_CASE
  - NATURAL_PR826_FAULT
  - ADMISSION_EVIDENCE
  - DIAGNOSIS_AGENT_RESULT
